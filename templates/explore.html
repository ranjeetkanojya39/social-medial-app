<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Explore</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>

<style>
body {
    background: #f0f2f5;
    font-family: 'Segoe UI', sans-serif;
}

/* 🔥 Sidebar */
.sidebar {
    position: fixed;
    width: 230px;
    height: 100vh;
    background: linear-gradient(180deg, #1d2671, #c33764);
    color: white;
    padding-top: 20px;
    box-shadow: 2px 0 10px rgba(0,0,0,0.2);
    z-index: 1000;
}

.sidebar a {
    color: white;
    display: block;
    padding: 10px;
    text-decoration: none;
    transition: 0.3s;
}

.sidebar a:hover {
    background: rgba(255,255,255,0.15);
    border-radius: 10px;
    padding-left: 15px;
}

/* 👤 Profile */
.profile-pic {
    width: 70px;
    height: 70px;
    border-radius: 50%;
    border: 3px solid white;
}

/* 🔥 Main */
.main {
    margin-left: 240px;
    padding: 20px;
}

/* 🔍 Topbar */
.topbar {
    background: white;
    padding: 15px 20px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
    margin-bottom: 20px;
}

/* Search input */
.topbar input {
    border-radius: 20px;
    border: 1px solid #ddd;
    padding: 8px 15px;
    width: 100%;
    max-width: 300px;
}

/* 🖼️ Grid */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 15px;
}

/* 📸 Post card */
.card-post {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
    background: white;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: 0.3s;
}

.card-post:hover {
    transform: translateY(-5px);
}

/* Image */
.card-post img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    transition: 0.4s;
}

.card-post:hover img {
    transform: scale(1.1);
    filter: brightness(0.6);
}

/* Overlay */
.overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    color: white;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: 0.3s;
    text-align: center;
    padding: 10px;
}

.card-post:hover .overlay {
    opacity: 1;
}

/* ❤️ Like button */
.like-btn {
    position: absolute;
    bottom: 10px;
    right: 10px;
    background: white;
    border-radius: 50%;
    padding: 10px;
    cursor: pointer;
    transition: 0.3s;
    box-shadow: 0 3px 10px rgba(0,0,0,0.2);
}

.like-btn i {
    color: red;
}

.like-btn.active {
    background: red;
}

.like-btn.active i {
    color: white;
}

/* 📱 Mobile Responsiveness */
@media (max-width: 768px) {
    .sidebar {
        width: 100%;
        height: auto;
        position: relative;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        justify-content: space-around;
        padding: 10px;
    }
    .sidebar h5, .sidebar .profile-pic {
        display: none; 
    }
    .sidebar a {
        padding: 5px 10px;
        font-size: 14px;
    }
    .main {
        margin-left: 0;
        padding: 10px;
    }
}
</style>
</head>

<body>

<!-- 🔥 Sidebar -->
<div class="sidebar text-center">
    <img src="{{ profile.profileimg.url }}" alt="Profile Picture" class="profile-pic">
    <h5 class="mt-2">@{{ user.username }}</h5>

    <a href="/"><i class="fa fa-home"></i> Home</a>
    <a href="/explore"><i class="fa fa-compass"></i> Explore</a>
    <a href="#"><i class="fa fa-search"></i> Search</a>
    <a href="#"><i class="fa fa-plus"></i> Create</a>
    <a href="/profile/{{ user.username }}"><i class="fa fa-user"></i> Profile</a>
    <a href="/logoutt"><i class="fa fa-sign-out"></i> Logout</a>
</div>

<!-- 🔥 Main -->
<div class="main">
    <!-- 🔍 Topbar -->
    <div class="topbar d-flex justify-content-between align-items-center">
        <h5>Explore 🔥</h5>
        <input type="text" placeholder="Search posts...">
    </div>

    <!-- 🖼️ Posts -->
    <div class="grid">
        {% for pos in post %}
        <div class="card-post">
            <img src="{{ pos.image.url }}" alt="Post by {{ pos.user }}">

            <div class="overlay">
                <h6>@{{ pos.user }}</h6>
                <p>{{ pos.caption }}</p>
            </div>

            <!-- Pre-check if user already liked it, and bind the post ID -->
            <div class="like-btn {% if request.user in pos.likes.all %}active{% endif %}" data-post-id="{{ pos.id }}" onclick="likePost(this)">
                <i class="fa fa-heart"></i>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<script>
// Helper function to extract the CSRF token from Django's cookies
function getCookie(name) {
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        const cookies = document.cookie.split(';');
        for (let i = 0; i < cookies.length; i++) {
            const cookie = cookies[i].trim();
            if (cookie.substring(0, name.length + 1) === (name + '=')) {
                cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                break;
            }
        }
    }
    return cookieValue;
}

function likePost(el) {
    const postId = el.getAttribute('data-post-id');
    
    // Toggle UI instantly so the user feels immediate feedback
    el.classList.toggle("active");

    // Send the POST request to the server
    fetch(`/like-post/${postId}/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json'
        }
    })
    .then(response => {
        if (!response.ok) {
            throw new Error("Network error");
        }
        return response.json();
    })
    .then(data => {
        if (!data.success) {
            // If the server says it failed, revert the heart UI back to its previous state
            el.classList.toggle("active");
            console.error("Backend failed to process the like.");
        }
    })
    .catch(error => {
        // If the request fails completely (e.g. no internet), revert the heart UI
        el.classList.toggle("active");
        console.error('Error:', error);
    });
}
</script>

</body>
</html>
