{% load static %}

<style>
/* 🌈 Modern Glass Effect */
.modal-content {
    border-radius: 20px;
    border: none;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
}

/* Header */
.modal-header {
    border-bottom: none;
}

/* Inputs */
.form-control {
    border-radius: 12px;
    border: none;
    padding: 10px;
}

/* File Upload */
.file-upload {
    border: 2px dashed #fff;
    padding: 20px;
    text-align: center;
    border-radius: 12px;
    cursor: pointer;
    transition: 0.3s;
}
.file-upload:hover {
    background: rgba(255,255,255,0.1);
}

/* Buttons */
.btn-primary {
    background: #ff7eb3;
    border: none;
    border-radius: 10px;
}
.btn-primary:hover {
    background: #ff4e9b;
}

.btn-secondary {
    border-radius: 10px;
}

/* Profile preview */
.profile-preview {
    width: 80px;
    height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #fff;
    margin-bottom: 10px;
}
</style>

<div class="modal fade" id="exampleModal1" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-3">
