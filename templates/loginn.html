<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://kit.fontawesome.com/cb792c0850.js" crossorigin="anonymous"></script>

<style>
body{
    height:100vh;
    background: linear-gradient(135deg,#667eea,#764ba2);
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:'Segoe UI',sans-serif;
}

/* 🔥 Glass Card */
.card{
    border:none;
    border-radius:20px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    box-shadow:0 10px 30px rgba(0,0,0,0.2);
    color:white;
}

/* Inputs */
.form-control{
    background:rgba(255,255,255,0.2);
    border:none;
    color:white;
    border-radius:10px;
}

.form-control::placeholder{
    color:#ddd;
}

.form-control:focus{
    box-shadow:none;
    background:rgba(255,255,255,0.3);
}

/* Button */
.btn-primary{
    background:#ff7eb3;
    border:none;
    border-radius:10px;
}

.btn-primary:hover{
    background:#ff4e9b;
}

/* Icons */
.icon{
    color:white;
}

/* Image */
.side-img{
    max-width:100%;
    animation: float 3s ease-in-out infinite;
}

@keyframes float{
    0%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
    100%{transform:translateY(0);}
}
</style>

</head>

<body>

<div class="container">
    <div class="row justify-content-center align-items-center">

```
    <div class="col-lg-10">
        <div class="card p-4">
            <div class="row align-items-center">

                <!-- FORM -->
                <div class="col-md-6">

                    <h2 class="text-center mb-4">✨ Login</h2>

                    {% if invalid %}
                    <div class="alert alert-danger">{{ invalid }}</div>
                    {% endif %}

                    <form method="post">
                        {% csrf_token %}

                        <!-- Username -->
                        <div class="mb-3">
                            <label>Username</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-0 icon">
                                    <i class="fas fa-user"></i>
                                </span>
                                <input type="text" name="fnm" class="form-control" placeholder="Enter username" required>
                            </div>
                        </div>

                        <!-- Password -->
                        <div class="mb-3">
                            <label>Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-transparent border-0 icon">
                                    <i class="fas fa-lock"></i>
                                </span>
                                <input type="password" id="pwd" name="pwd" class="form-control" placeholder="Enter password" required>
                                
                                <!-- Show/Hide -->
                                <span class="input-group-text bg-transparent border-0 icon" onclick="togglePassword()">
                                    <i class="fas fa-eye" id="eyeIcon"></i>
                                </span>
                            </div>
                        </div>

                        <!-- Signup -->
                        <div class="mb-3 text-center">
                            Don't have an account? <a href="/signup" class="text-white">Signup</a>
                        </div>

                        <!-- Button -->
                        <div class="text-center">
                            <button class="btn btn-primary w-100">Login 🚀</button>
                        </div>

                    </form>
                </div>

                <!-- IMAGE -->
                <div class="col-md-6 d-none d-md-block text-center">
                    <img src="https://cdn-icons-png.flaticon.com/512/295/295128.png" class="side-img">
                </div>

            </div>
        </div>
    </div>

</div>
```

</div>

<script>
function togglePassword(){
    let pwd = document.getElementById("pwd");
    let icon = document.getElementById("eyeIcon");

    if(pwd.type === "password"){
        pwd.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
    }else{
        pwd.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
    }
}
</script>

</body>
</html>
